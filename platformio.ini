[env:esp32-c6-lcd-1_3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.flash_size = 4MB
; No OTA is used, so give the app the whole 3 MB (default.csv caps it at
; 1.25 MB, which the WiFi+TLS firmware plus the plane gif nearly fills).
board_build.partitions = huge_app.csv

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0

monitor_speed = 115200
monitor_port = /dev/cu.usbmodem101
upload_port = /dev/cu.usbmodem101
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
